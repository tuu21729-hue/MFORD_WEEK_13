<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3x3 Colored Button Grid</title>
  <style>
    /* Grid container: creates 3 equal columns */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px; /* Space between rows and columns */
      max-width: 600px;
      margin: 40px auto;
    }

    /* Shared styling for all buttons */
    .btn {
      padding: 16px 20px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.85;
    }

    /* Individual button colors */
    .btn-1 { background-color: #3fe639; } /* Red */
    .btn-2 { background-color: #f4a261; } /* Orange */
    .btn-3 { background-color: #e9c46a; color: #222; } /* Yellow with dark text */
    .btn-4 { background-color: #2a9d8f; } /* Teal */
    .btn-5 { background-color: #457b9d; } /* Steel Blue */
    .btn-6 { background-color: #1d3557; } /* Navy */
    .btn-7 { background-color: #8338ec; } /* Purple */
    .btn-8 { background-color: #ff006e; } /* Magenta */
    .btn-9 { background-color: #38b000; } /* Green */
  </style>
</head>
<body>

  <div class="button-grid">
    <!-- Row 1 -->
    <button class="btn btn-1">Home</button>
    <button class="btn btn-2">Profile</button>
    <button class="btn btn-3">Messages</button>

    <!-- Row 2 -->
    <button class="btn btn-4">Settings</button>
    <button class="btn btn-5">Analytics</button>
    <button class="btn btn-6">Reports</button>

    <!-- Row 3 -->
    <button class="btn btn-7">Billing</button>
    <button class="btn btn-8">Support</button>
    <button class="btn btn-9">Log Out</button>
  </div>

</body>
</html>
